<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --indigo:#4F46E5; --indigo-2:#6366F1; --indigo-d:#312E81;
  --bg:#0F0D2E; --bg-2:#1A1747; --card:#221F55; --line:rgba(255,255,255,.10);
  --txt:#F5F3FF; --mute:#A5A3D1; --ok:#22C55E; --ko:#EF4444; --warm:#E48548;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--txt);
  background:radial-gradient(1200px 700px at 15% -10%,#3B2FBF 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#7C2D92 0%,transparent 55%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--indigo-2);box-shadow:0 0 0 3px rgba(99,102,241,.3)}
select option{background:var(--bg-2)}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:24px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
h1{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1}
h2{font-size:clamp(22px,3vw,32px);font-weight:700;letter-spacing:-.02em}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:600;background:var(--indigo);box-shadow:0 6px 0 var(--indigo-d);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--indigo-d)}
.btn.big{font-size:20px;padding:18px 30px}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:active{transform:translateY(1px)}
.btn.warm{background:var(--warm);box-shadow:0 6px 0 #9A4F22}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.card{background:rgba(34,31,85,.75);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(8px)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:13px;font-weight:600}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo b{color:var(--warm)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line)}

/* Home */
.choices-home{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%;max-width:720px;margin-top:10px}
.home-card{text-align:left;padding:26px;border-radius:22px;background:rgba(34,31,85,.8);border:1px solid var(--line);transition:transform .2s,border-color .2s}
.home-card:hover{transform:translateY(-4px);border-color:var(--indigo-2)}
.home-card .ico{font-size:38px;margin-bottom:12px}
.home-card h3{font-size:22px;margin-bottom:6px}

/* Editor */
.qcard{margin-bottom:14px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qnum{width:34px;height:34px;border-radius:10px;background:var(--indigo);display:grid;place-items:center;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.lbl{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;display:block}
.choice-edit{display:flex;gap:8px;align-items:center;margin-top:8px}
.choice-edit .sw{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
.choice-edit label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap;cursor:pointer}
.choice-edit input[type=checkbox],.choice-edit input[type=radio]{width:18px;height:18px;accent-color:var(--ok)}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);flex:none}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.type-help{font-size:13px;color:var(--mute);margin-top:6px}
.banner{background:linear-gradient(90deg,rgba(228,133,72,.25),rgba(79,70,229,.25));border:1px solid rgba(228,133,72,.5);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--indigo-2)}

/* Lobby */
.code{font-size:clamp(56px,12vw,120px);font-weight:700;letter-spacing:.12em;line-height:1;background:linear-gradient(90deg,#fff,#C7D2FE);-webkit-background-clip:text;background-clip:text;color:transparent}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
.ptag{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:600;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;cursor:pointer}
.ptag:hover{background:rgba(239,68,68,.25)}
.ptag .dot{width:10px;height:10px;border-radius:50%}
.teams-lobby{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:100%;max-width:1000px}
.team-col{border-radius:18px;padding:14px;border:2px solid;min-height:120px;text-align:left}
.team-col h3{margin-bottom:10px;display:flex;justify-content:space-between}
.team-col .ptag{margin:0 6px 6px 0}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

/* Question host */
.stage{flex:1;display:flex;flex-direction:column;padding:24px;gap:20px;max-width:1300px;width:100%;margin:0 auto}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-text{font-size:clamp(26px,4.2vw,52px);font-weight:700;letter-spacing:-.02em;text-align:center;line-height:1.1;padding:10px 20px;animation:slideUp .5s both}
.q-mid{display:flex;align-items:center;justify-content:center;gap:40px;flex:1;min-height:140px}
.timer{position:relative;width:130px;height:130px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer .t-num{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:700}
.counter{text-align:center}
.counter .n{font-size:56px;font-weight:700;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:16px;font-size:clamp(18px,2.4vw,28px);font-weight:600;min-height:86px;overflow:hidden;animation:slideUp .45s both;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.tile .shape{font-size:28px;opacity:.9;flex:none}
.tile .lab{flex:1;position:relative;z-index:1;text-align:left}
.tile .cnt{position:relative;z-index:1;font-size:26px;font-weight:700}
.tile .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.tile.dim{opacity:.35;filter:saturate(.4)}
.tile.win{outline:4px solid #fff;outline-offset:-4px}
.tile.win::after{content:'✓';position:absolute;right:16px;top:8px;font-size:18px;z-index:2}
@keyframes slideUp{0%{transform:translateY(24px);opacity:0}100%{transform:none;opacity:1}}
.ready-num{font-size:clamp(80px,18vw,200px);font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.est-box{font-size:clamp(40px,8vw,90px);font-weight:700;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}

/* Leaderboard */
.lb{position:relative;width:100%;max-width:760px;margin:0 auto}
.lb-row{position:absolute;left:0;right:0;height:62px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);transition:top .9s cubic-bezier(.4,1.3,.5,1),background .3s;font-weight:600;font-size:20px}
.lb-row .rk{width:34px;font-weight:700;color:var(--mute)}
.lb-row .em{font-size:26px}
.lb-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .gain{font-size:15px;color:var(--ok);min-width:70px;text-align:right}
.lb-row .sc{font-weight:700;min-width:80px;text-align:right}
.lb-row.top1{background:linear-gradient(90deg,rgba(245,165,36,.4),rgba(245,165,36,.1));border-color:rgba(245,165,36,.6)}
.team-bars{display:flex;flex-direction:column;gap:10px;width:100%;max-width:760px;margin:0 auto}
.team-bar{display:flex;align-items:center;gap:12px}
.team-bar .tb-name{width:140px;font-weight:700;text-align:left}
.team-bar .tb-track{flex:1;height:30px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
.team-bar .tb-fill{height:100%;width:0;border-radius:10px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.team-bar .tb-sc{width:70px;text-align:right;font-weight:700}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin-top:20px}
.pod{width:min(200px,28vw);display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .who{animation:drop .7s cubic-bezier(.2,1.5,.4,1) both;text-align:center}
.pod .who .em{font-size:52px;display:block}
.pod .who .nm{font-weight:700;font-size:20px}
.pod .who .sc{color:var(--mute)}
.pod .block{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:start center;padding-top:14px;font-size:42px;font-weight:700;height:0;transition:height 1s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{0%{transform:translateY(-120px);opacity:0}100%{transform:none;opacity:1}}

/* Player */
.p-wrap{flex:1;display:flex;flex-direction:column;padding:16px 16px 100px;gap:14px;max-width:560px;width:100%;margin:0 auto}
.p-head{display:flex;justify-content:space-between;align-items:center}
.p-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1}
.p-tiles.many{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.p-tile{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;font-weight:700;font-size:18px;min-height:120px;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .08s;animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.p-tile .shape{font-size:34px}
.p-tile:active{transform:translateY(4px) scale(.98)}
.p-feedback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;border-radius:24px;padding:24px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.p-feedback .big{font-size:42px;font-weight:700;line-height:1.05}
.p-feedback .emo{font-size:72px}
.p-feedback .pts{font-size:30px;font-weight:700}
.emoji-pick{font-size:64px;cursor:pointer;transition:transform .2s;display:inline-block}
.emoji-pick:hover{transform:rotate(-12deg) scale(1.1)}
.team-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.team-pick button{padding:14px;border-radius:14px;border:2px solid;font-weight:700}
.team-pick button.sel{color:#fff}
.mini-timer{height:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.mini-timer div{height:100%;background:linear-gradient(90deg,var(--warm),var(--indigo-2));width:100%}

/* misc */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:100;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.qr{background:#fff;border-radius:16px;padding:10px;width:170px;height:170px}
.qr svg{width:100%;height:100%;display:block}
.net{font-size:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal-bg{position:fixed;inset:0;background:rgba(8,6,30,.75);backdrop-filter:blur(6px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:820px;max-height:92vh;overflow:auto;background:#1A1747;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal textarea{font-family:ui-monospace,Menlo,monospace;font-size:14px;min-height:240px}
.prev{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.prev div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}
.prev .err{background:rgba(239,68,68,.18);color:#FCA5A5}
.fmt{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:rgba(255,255,255,.05);border-radius:12px;padding:12px;white-space:pre-wrap;color:#C7D2FE}
.lib{display:flex;flex-direction:column;gap:8px}
.lib-row{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.lib-row.cur{border-color:var(--indigo-2);background:rgba(99,102,241,.15)}
.lib-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom{border-color:var(--warm)!important}
/* ---- Effets / Noël ---- */
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1}
body.th-noel{background:radial-gradient(1200px 700px at 15% -10%,#1E3A8A 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#7F1D1D 0%,transparent 55%),#0A1230;background-attachment:fixed}
.hills{position:fixed;left:0;right:0;bottom:0;width:100%;height:90px;pointer-events:none;z-index:0;display:none}
body.th-noel.lobbyfx .hills{display:block}
body.th-hot{--warm:#F97316;background:radial-gradient(1100px 700px at 10% -10%,#9A3412 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#B91C1C 0%,transparent 55%),#1A0505;background-attachment:fixed}
body.th-anniv{--warm:#EC4899;background:radial-gradient(1100px 700px at 10% -10%,#6D28D9 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#DB2777 0%,transparent 55%),#1B0B3A;background-attachment:fixed}
body.th-dance{--warm:#D946EF;background:radial-gradient(900px 600px at 20% 0%,#7E22CE 0%,transparent 60%),radial-gradient(800px 600px at 100% 100%,#0E7490 0%,transparent 55%),#05010F;background-attachment:fixed}
body.th-sexy{--warm:#F43F5E;background:radial-gradient(1000px 700px at 15% -10%,#9D174D 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#BE123C 0%,transparent 55%),#14020A;background-attachment:fixed}
.deco{position:fixed;pointer-events:none;z-index:0;display:none}
body.th-anniv.lobbyfx .bunting{display:block}
.bunting{top:64px;left:0;right:0;width:100%;height:46px}
body.th-hot .heat{display:block}
.heat{left:0;right:0;bottom:0;height:34vh;background:linear-gradient(0deg,rgba(249,115,22,.35),rgba(239,68,68,.12) 40%,transparent);animation:heat 2.2s ease-in-out infinite alternate;transform-origin:bottom}
@keyframes heat{from{opacity:.65;transform:scaleY(.92)}to{opacity:1;transform:scaleY(1.06)}}
body.th-dance .beams{display:block}
.beams{inset:0;overflow:hidden;mix-blend-mode:screen;opacity:.33}
.beams i{position:absolute;top:-20vh;width:30vw;height:140vh;transform-origin:50% 0;filter:blur(10px)}
.beams i:nth-child(1){left:8vw;background:linear-gradient(180deg,rgba(34,211,238,.9),transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sweep 6s ease-in-out infinite alternate}
.beams i:nth-child(2){right:8vw;background:linear-gradient(180deg,rgba(232,121,249,.9),transparent 75%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);animation:sweep 5s ease-in-out -2s infinite alternate-reverse}
.beams i:nth-child(3){left:38vw;background:linear-gradient(180deg,rgba(250,204,21,.8),transparent 70%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);animation:sweep 7s ease-in-out -4s infinite alternate}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
body.th-sexy .glow{display:block}
.glow{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,18,60,.35) 100%);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.6}to{opacity:1}}
.flyer{position:fixed;top:0;left:0;z-index:2;pointer-events:none;white-space:nowrap;line-height:1}
.flyer .big{font-size:64px;display:inline-block}
.flyer .trail{font-size:28px;opacity:.85;margin-right:4px;animation:twk .4s infinite alternate}
.flyer.cross{animation:sleigh 9s linear forwards}
.flyer.rise{top:auto;bottom:0;animation:rise 10s ease-in forwards}
@keyframes rise{0%{transform:translate(0,30vh)}50%{transform:translate(6vw,-50vh) rotate(4deg)}100%{transform:translate(-4vw,-130vh) rotate(-4deg)}}
.flyer.drop{animation:drop 10s ease-in-out forwards;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.flyer.drop .cord{width:2px;height:22vh;background:linear-gradient(#999,#ddd)}
.flyer.drop .big{animation:spin 2s linear infinite}
@keyframes drop{0%{transform:translateY(-60vh)}20%{transform:translateY(0) rotate(6deg)}35%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}65%{transform:rotate(-4deg)}80%{transform:translateY(0) rotate(2deg)}100%{transform:translateY(-60vh)}}
@keyframes spin{from{filter:hue-rotate(0deg) brightness(1.1)}to{filter:hue-rotate(360deg) brightness(1.3)}}
.cheer{position:fixed;left:50%;top:38%;z-index:65;pointer-events:none;font-size:clamp(28px,8vw,46px);font-weight:700;white-space:nowrap;text-shadow:0 4px 18px rgba(0,0,0,.5);animation:cheer 1.9s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes cheer{0%{transform:translate(-50%,0) scale(.3) rotate(-8deg);opacity:0}20%{transform:translate(-50%,0) scale(1.1) rotate(3deg);opacity:1}70%{transform:translate(-50%,-20px) scale(1);opacity:1}100%{transform:translate(-50%,-60px) scale(.9);opacity:0}}
.p-avatar{font-size:84px;line-height:1;display:inline-block;animation:dance 1.2s ease-in-out infinite;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
.shake{animation:shake .5s both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.sleigh{position:fixed;top:12vh;left:0;z-index:2;pointer-events:none;width:min(360px,80vw);animation:sleigh 10s linear forwards}
.sleigh svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes sleigh{0%{transform:translate(-110%,0)}25%{transform:translate(22vw,-28px)}50%{transform:translate(48vw,12px)}75%{transform:translate(74vw,-22px)}100%{transform:translate(102vw,0)}}
.sleigh .bob{animation:bob .45s ease-in-out infinite alternate}
.sleigh .bob2{animation:bob .45s ease-in-out .2s infinite alternate}
@keyframes bob{to{transform:translateY(5px)}}
.sleigh .twk{animation:twk 1s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.2}to{opacity:1}}
.arena{position:relative;width:100%;max-width:1000px;height:clamp(220px,34vh,340px);border-radius:24px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.18);overflow:hidden}
.arena .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute)}
.bubble{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-weight:700;font-size:18px;white-space:nowrap;cursor:pointer;will-change:transform;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bubble .e{font-size:30px;line-height:1}
.bubble:hover{background:rgba(239,68,68,.35)}
.ptag.wiggle{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both,wiggle 2.4s ease-in-out .45s infinite}

<script>
/* =========================================================
   QUIZ PARTY · V1 locale
   Architecture :
   - L'animateur (host) est la source de vérité : il calcule les scores
     et diffuse un "état public" à tous les joueurs.
   - Les joueurs envoient seulement : join, answer, hello.
   - Le transport est isolé dans createTransport() :
     V1 = BroadcastChannel (onglets du même navigateur)
     V2 = Supabase Realtime (même API send/on, voir commentaire)
   ========================================================= */

const APP_VERSION = '2026-11-22g'; // à changer à chaque mise en ligne : les téléphones en retard se rechargent seuls
const $ = (s, el = document) => el.querySelector(s);

// grand écran en mode bilingue : les textes importants s'affichent dans les deux langues
const L2 = (fr, en) => (typeof G !== 'undefined' && G && G.mode === 'both' && location.hash.startsWith('#host')) ? `${fr} · ${en}` : L(fr, en);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },

  del(k){ try{ localStorage.removeItem(k); }catch{} }

const sess = {
  get(k, d){ try{ const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch{} }

const COLORS = ['#E5484D','#3E63DD','#F5A524','#30A46C','#8E4EC6','#0EA5B7'];
const SHAPES = ['▲','◆','●','■','★','⬟'];
const EMOJIS = Array.from('🦊🐼🐸🐙🦄🐯🐵🐧🦁🐨🐷🦉🐢🐳🦖🍕🌮🍩🚀👾🤖👻🎃🐝🦋🐲🌵🍉🧀🥑');

};

/* ---------------- Ambiances ---------------- */
const THEMES = {

  hot:       {label:'🌶️ Hot (pimenté)',    particle:'embers',   react:'🌶️', proj:'🌶️', projName:'un piment', projEn:'a chili', burst:['🔥','🌶️','💥','🥵'], splat:['#F97316','#FACC15','#EF4444'], cheer:'Caliente ! 🔥', cheerEn:'So hot! 🔥', titleIcon:'🌶️'},
  anniv:     {label:'🎂 Anniversaire',     particle:'confetti', react:'🎈', proj:'🎈', projName:'un ballon', projEn:'a balloon', burst:['🎈','🎉','🎂','🎁','🥳'], splat:['#E5484D','#3E63DD','#F5A524','#30A46C','#8E4EC6','#0EA5B7'], cheer:'Hip hip hip, hourra ! 🎉', cheerEn:'Hip hip hooray! 🎉', titleIcon:'🎂'},
  dance:     {label:'🪩 Soirée dansante',  particle:'disco',    react:'🎵', proj:'🎵', projName:'une note de musique', projEn:'a music note', burst:['🎵','🎶','🪩','✨','💃','🕺'], splat:['#22D3EE','#E879F9','#FACC15','#A3E635'], cheer:'Ça groove ! 🕺', cheerEn:'Groovy! 🕺', titleIcon:'🪩'},
  sexy:      {label:'💋 Sooo sexy',        particle:'petals',   react:'💋', proj:'💋', projName:'un bisou', projEn:'a kiss', burst:['💋','❤️','🌹','✨','😘'], splat:['#F43F5E','#FB7185','#FDA4AF','#BE123C'], cheer:'Irrésistible 😘', cheerEn:'Irresistible 😘', titleIcon:'💋'},

};

/* ---------------- Transport ----------------
   Deux canaux en parallèle :
   1. BroadcastChannel : onglets du même navigateur (test solo)
   2. PeerJS (WebRTC) : vrais appareils différents, sans serveur à nous.
      L'animateur s'enregistre sous l'id "quizparty-<CODE>", les joueurs s'y connectent.
   V2 Supabase : remplacer le bloc PeerJS par un channel Realtime (même send/on).
-------------------------------------------- */
const PEER_PREFIX = 'quizparty-v1-';
let NET = 'off';  // off | connecting | online
function setNet(v){ NET = v; const el = document.getElementById('net');
  if(el) el.innerHTML = {online:L('🟢 En ligne','🟢 Online'), connecting:L('🟡 Connexion...','🟡 Connecting...'), off:L('⚪ Local seulement','⚪ Local only')}[v]; }
function peerOpts(){ try{ return JSON.parse(localStorage.getItem('quiz-peer-opts') || '{}'); }catch{ return {}; } }

function createTransport(room, role){
  const listeners = [];
  const emit = m => listeners.forEach(f => f(m));
  let bc = null, closed = false;
  try{ bc = new BroadcastChannel('quiz-party-' + room); bc.onmessage = e => emit(e.data); }catch(e){}

  let peer = null, conns = [], hostConn = null, queue = [], connect = () => {};
  const hostId = PEER_PREFIX + room;
  if(window.Peer){
    setNet('connecting');
    if(role === 'host'){
      const open = () => {
        if(closed) return;
        peer = new Peer(hostId, peerOpts());
        peer.on('open', () => setNet('online'));
        peer.on('connection', c => {
          conns.push(c);
          c.on('data', d => emit(d));
          c.on('close', () => { conns = conns.filter(x => x !== c); });
        });
        peer.on('disconnected', () => { setNet('connecting'); try{ peer.reconnect(); }catch(e){} });
        peer.on('error', e => {
          console.warn('peer', e.type);
          if(e.type === 'unavailable-id'){ try{ peer.destroy(); }catch(_){} setTimeout(open, 2500); } // ancien id pas encore libéré
          if(e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error'){
            setNet('off');
            setTimeout(() => { if(closed) return; if(peer.destroyed) open(); else if(peer.disconnected){ try{ peer.reconnect(); }catch(_){} } }, 3000);
          }
        });
      };
      open();
    } else {
      peer = new Peer(peerOpts());
      connect = () => {
        if(closed || !peer || peer.destroyed || peer.disconnected) return;
        if(hostConn && hostConn.open) return;                 // déjà connecté : pas de doublon
        if(hostConn){ try{ hostConn.removeAllListeners && hostConn.removeAllListeners(); hostConn.close(); }catch(_){} }
        hostConn = peer.connect(hostId, {reliable:true});
        hostConn.on('open', () => { setNet('online'); queue.splice(0).forEach(m => hostConn.send(m)); emit({from:'_net', kind:'open'}); });
        hostConn.on('data', d => emit(d));
        hostConn.on('close', () => { if(closed) return; setNet('connecting'); setTimeout(connect, 1500); });
        hostConn.on('error', () => {});
      };
      peer.on('open', connect);
      peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
      peer.on('error', e => {
        console.warn('peer', e.type);
        if(e.type === 'peer-unavailable'){ setNet('connecting'); setTimeout(connect, 2000); }
        if(e.type === 'network' || e.type === 'server-error' || e.type === 'socket-error'){
          setNet('off'); setTimeout(() => { if(!closed && peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(_){} } }, 3000);
        }
      });
    }
  }
  return {
    send(m){
      try{ bc && bc.postMessage(m); }catch(e){}
      if(!peer) return;
      if(role === 'host') conns.forEach(c => { if(c.open) try{ c.send(m); }catch(e){} });
      else if(hostConn && hostConn.open) try{ hostConn.send(m); }catch(e){}
      else { queue.push(m); if(queue.length > 20) queue.shift(); }
    },
    on(f){ listeners.push(f); },
    // côté joueur : force une reconnexion propre (téléphone sorti de veille, connexion silencieusement morte)
    kick(){ if(closed || role === 'host' || !peer) return;
      if(peer.destroyed) return;
      if(peer.disconnected){ try{ peer.reconnect(); }catch(_){} return; }
      if(hostConn){ try{ hostConn.close(); }catch(_){} } else connect(); },
    close(){ closed = true; try{ bc && bc.close(); }catch(e){} try{ peer && peer.destroy(); }catch(e){} }
  };
}

function beep(freq = 660, dur = .12, type = 'sine', vol = .08){
  if(muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

// Confettis
const cv = $('#confetti'), cx = cv.getContext('2d'); let parts = [], confRAF = null;
function resizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener('resize', resizeCv); resizeCv();
function confetti(n = 160){
  for(let i = 0; i < n; i++) parts.push({
    x: cv.width * (.2 + Math.random() * .6), y: cv.height * .35,
    vx: (Math.random() - .5) * 22 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio,

  });
  if(!confRAF) loopConf();
}
function loopConf(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .5 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;

const BUB = new Map(); let arenaRAF = null;
function arenaHTML(players){
  return `<div class="arena" id="arena">${players.map(p => { const b = BUB.get(p.id);
    return `<div class="bubble" data-h="kick" data-id="${esc(p.id)}" title="Cliquer pour retirer" style="transform:${b ? `translate(${b.x}px,${b.y}px)` : 'translate(-9999px,0)'}"><span class="e">${p.emoji}</span>${esc(p.name)}</div>`; }).join('')}
    ${players.length ? '' : `<div class="empty">${L('En attente des joueurs...', 'Waiting for players...')}</div>`}</div>`;

function runArena(){
  cancelAnimationFrame(arenaRAF);
  const A = $('#arena'); if(!A) return;
  let t = 0;
  const step = () => {
    if(!A.isConnected) return;
    t++;
    const W = A.clientWidth, H = A.clientHeight;
    const items = [...A.querySelectorAll('.bubble')].map(el => {
      const id = el.dataset.id; let b = BUB.get(id);
      if(!b){ b = {x: W / 2 - 60 + (Math.random() - .5) * W * .5, y: -60, vx: (Math.random() - .5) * 3, vy: 3, rot: 0, spin: 0, enter: true, ph: Math.random() * 6}; BUB.set(id, b); beep(990, .06, 'sine', .04); }
      if(b.el !== el){ b.el = el; b.w = el.offsetWidth; b.h = el.offsetHeight; }
      return b;
    });
    for(const b of items){
      b.vx += (Math.random() - .5) * .12; b.vy += (Math.random() - .5) * .12;
      if(b.enter){ b.vy += .25; if(b.y > 0) b.enter = false; }
      const sp = Math.hypot(b.vx, b.vy);
      if(!b.enter && sp > 1.4){ b.vx *= .97; b.vy *= .97; }
      if(sp < .35){ b.vx *= 1.1; b.vy *= 1.1; }
      b.x += b.vx; b.y += b.vy;
      if(b.x < 0){ b.x = 0; b.vx = Math.abs(b.vx); }
      if(b.x > W - b.w){ b.x = W - b.w; b.vx = -Math.abs(b.vx); }
      if(b.y > H - b.h){ b.y = H - b.h; b.vy = -Math.abs(b.vy) * .8; }
      if(!b.enter && b.y < 0){ b.y = 0; b.vy = Math.abs(b.vy); }
    }
    for(let i = 0; i < items.length; i++) for(let j = i + 1; j < items.length; j++){
      const a = items[i], c = items[j];
      const dx = (c.x + c.w / 2) - (a.x + a.w / 2), dy = (c.y + c.h / 2) - (a.y + a.h / 2);
      const ox = (a.w + c.w) / 2 - Math.abs(dx), oy = (a.h + c.h) / 2 - Math.abs(dy);
      if(ox > 0 && oy > 0){
        if(ox < oy){ const s = Math.sign(dx) || 1; a.x -= s * ox / 2; c.x += s * ox / 2; const v = a.vx; a.vx = c.vx; c.vx = v; }
        else { const s = Math.sign(dy) || 1; a.y -= s * oy / 2; c.y += s * oy / 2; const v = a.vy; a.vy = c.vy; c.vy = v; }
      }
    }
    for(const b of items){
      b.spin *= .94;
      b.rot = Math.sin(t / 30 + b.ph) * 5 + b.spin;
      b.el.style.transform = `translate(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px) rotate(${b.rot.toFixed(1)}deg)`;
    }
    arenaRAF = requestAnimationFrame(step);
  };
  arenaRAF = requestAnimationFrame(step);
}

  d.questions = (d.questions || []).map(q => ({...newQuestion(q.type || 'qcm', d.defaults), ...q, id: q.id || uid(), choices: q.choices || [], correct: q.correct || []}));
  d.updatedAt = d.updatedAt || Date.now();
  return d;
}
function loadLibrary(){
  let lib = store.get('quiz-library', null);
  if(!Array.isArray(lib) || !lib.length){
    const old = store.get('quiz-draft', null); // reprise de l'ancienne sauvegarde unique
    lib = [old || demoQuiz()];
  }
  return lib.map(normalizeQuiz);
}
let LIB = loadLibrary();
let QUIZ = LIB.find(q => q.id === store.get('quiz-current', null)) || LIB[0];
function saveLibrary(){ store.set('quiz-library', LIB); store.set('quiz-current', QUIZ.id); }
function saveQuiz(){
  QUIZ.updatedAt = Date.now();
  const i = LIB.findIndex(q => q.id === QUIZ.id);
  if(i < 0) LIB.unshift(QUIZ); else LIB[i] = QUIZ;
  saveLibrary();
}
function downloadJSON(obj, name){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob);
  l.download = name.replace(/[^\wÀ-ÿ-]+/g, '_') + '.json'; document.body.appendChild(l); l.click(); l.remove();
}
const fmtDate = t => new Date(t).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

function openLibrary(saved){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  const draw = () => {
    const list = [...LIB].sort((a,b) => b.updatedAt - a.updatedAt);
    bg.innerHTML = `<div class="modal">
      <div class="row"><h2 class="grow">📚 Mes quiz</h2><button class="icon-btn" data-l="close">✕</button></div>
      <div class="row"><button class="btn sm warm" data-l="new">+ Nouveau quiz</button><button class="btn ghost sm" data-l="demo">+ Quiz de démo</button>
        <div class="grow"></div><button class="btn ghost sm" data-l="exportAll">⬇️ Sauvegarder tout</button><button class="btn ghost sm" data-l="restore">⬆️ Restaurer</button></div>
      <div class="lib">${list.map(q => `<div class="lib-row ${q.id === QUIZ.id ? 'cur' : ''}">
        <div class="grow" style="min-width:0"><div class="lib-t">${esc(q.title)}${q.id === QUIZ.id ? ' <span class="pill" style="font-size:11px;padding:3px 8px">ouvert</span>' : ''}</div>
          <div class="mute" style="font-size:13px">${q.questions.length} question${q.questions.length > 1 ? 's' : ''} · modifié le ${fmtDate(q.updatedAt)}</div></div>
        ${q.id !== QUIZ.id ? `<button class="btn sm" data-l="open" data-id="${q.id}">Ouvrir</button>` : ''}
        <button class="icon-btn" data-l="dup" data-id="${q.id}" title="Dupliquer">⧉</button>
        <button class="icon-btn" data-l="export" data-id="${q.id}" title="Exporter ce quiz">⬇️</button>
        <button class="icon-btn" data-l="del" data-id="${q.id}" title="Supprimer">🗑</button></div>`).join('')}</div>
      <p class="mute" style="font-size:13px">Les quiz sont enregistrés dans ce navigateur, sur cet ordi. "Sauvegarder tout" télécharge un fichier de secours que tu peux restaurer n'importe où.</p>
      <input type="file" id="libIn" accept=".json" hidden></div>`;
    $('#libIn', bg).onchange = async e => {
      try{ const d = JSON.parse(await e.target.files[0].text());
        const arr = Array.isArray(d.library) ? d.library : Array.isArray(d) ? d : (Array.isArray(d.questions) ? [d] : null);
        if(!arr) throw 0;
        let added = 0;
        arr.forEach(q => { q = normalizeQuiz(q); const i = LIB.findIndex(x => x.id === q.id);
          if(i >= 0){ if(q.updatedAt >= LIB[i].updatedAt) LIB[i] = q; } else { LIB.push(q); added++; } });
        QUIZ = LIB.find(q => q.id === QUIZ.id) || LIB[0]; saveLibrary(); draw(); toast(`${arr.length} quiz restauré(s) ✅`);
      }catch{ toast('Fichier invalide'); }
    };
  };
  const close = () => { bg.remove(); renderEditor(saved); };
  bg.addEventListener('click', e => {
    if(e.target === bg) return close();
    const b = e.target.closest('[data-l]'); if(!b) return;
    const a = b.dataset.l, q = LIB.find(x => x.id === b.dataset.id);
    if(a === 'close') return close();
    if(a === 'new'){ QUIZ = normalizeQuiz({title:'Nouveau quiz', questions:[]}); saveQuiz(); return close(); }
    if(a === 'demo'){ QUIZ = normalizeQuiz(demoQuiz()); saveQuiz(); return close(); }
    if(a === 'open'){ QUIZ = q; saveLibrary(); return close(); }
    if(a === 'dup'){ const c = normalizeQuiz({...JSON.parse(JSON.stringify(q)), id:uid(), title: q.title + ' (copie)', updatedAt: Date.now()}); LIB.push(c); saveLibrary(); draw(); }
    if(a === 'export') downloadJSON(q, q.title || 'quiz');
    if(a === 'exportAll') downloadJSON({app:'quiz-party', savedAt:new Date().toISOString(), library:LIB}, 'quiz-party-sauvegarde-' + new Date().toISOString().slice(0,10));
    if(a === 'restore') $('#libIn', bg).click();
    if(a === 'del'){
      if(!confirm(`Supprimer "${q.title}" ? Cette action est définitive.`)) return;
      LIB = LIB.filter(x => x.id !== q.id);
      if(!LIB.length) LIB.push(normalizeQuiz({title:'Nouveau quiz', questions:[]}));
      if(QUIZ.id === q.id) QUIZ = LIB[0];
      saveLibrary(); draw();
    }
  });
  document.body.appendChild(bg); draw();
}

function curDefaults(){ try{ return QUIZ && QUIZ.defaults; }catch(e){ return null; } } // try : QUIZ peut ne pas encore exister
function newQuestion(type, D){
  D = {time:20, points:1000, speed:true, read:3, board:true, ...(D || curDefaults() || {})};
  const base = {id:uid(), type, text:'', choices:['',''], correct:[], time:D.time, points:D.points, speed:D.speed, read:D.read, board:D.board};
  if(type === 'vf') Object.assign(base, {choices:[], correct:[0]});
  if(type === 'qcm') Object.assign(base, {choices:['','','',''], correct:[0]});
  if(type === 'majorite' || type === 'minorite') Object.assign(base, {choices:['','','']});
  if(type === 'sondage') Object.assign(base, {choices:['','',''], points:0, speed:false});
  if(type === 'estimation') Object.assign(base, {choices:[], answer:'', unit:'', speed:false});
  if(type === 'libre') Object.assign(base, {choices:[], correct:[], accepted:[''], fuzzy:true});
  if(type === 'panneau') Object.assign(base, {choices:[], correct:[], body:'', time:0, points:0, speed:false, read:0, showBoard:false});
  return base;
}

/* ---------- Import texte ----------
   Format simple, pensé pour être dicté puis collé :

   QCM: Quelle est la capitale de l'Australie ? [20s] [1000pts]
   - Sydney
   * Canberra
   - Melbourne

   VF: Le cœur d'une crevette est dans sa tête.
   = Vrai

   ESTIMATION: Année du premier pas sur la Lune ?
   = 1969

   Types : QCM, VF, MAJORITE, MINORITE, SONDAGE, ESTIMATION (Q: = QCM)
   "*" = bonne réponse, "-" = autre réponse, "=" = réponse (VF ou estimation)
   Options : [20s] [1000pts] [vitesse] [sans vitesse]
------------------------------------ */
const IMPORT_FORMAT = `QCM: Quelle est la capitale de l'Australie ? [20s] [1000pts]
- Sydney
* Canberra
- Melbourne
- Perth

VF: Le cœur d'une crevette se trouve dans sa tête.
= Vrai

MAJORITE: Pizza à l'ananas, crime ou génie ?
- Crime
- Génie

MINORITE: Choisis un chiffre.
- 1
- 2
- 3

SONDAGE: Prochaine soirée ?
- Raclette
- Karaoké

ESTIMATION: En quelle année le premier pas sur la Lune ? [25s] [lecture 5s]
= 1969

LIBRE: Quel est le prénom du Père Noël en Russie ?
= Ded Moroz / Dedushka Moroz

PANNEAU: Pause apéro ! [classement]
On reprend dans 5 minutes`;

const CLAUDE_PROMPT = `Transforme mes questions au format "Quiz Party" ci-dessous. Réponds uniquement avec le bloc de texte, sans commentaire.

Règles :
- Chaque question commence par son type suivi de ":" : QCM, VF (vrai/faux), LIBRE (réponse à écrire), MAJORITE (la réponse la plus votée gagne), MINORITE (la moins votée gagne), SONDAGE (pas de points), ESTIMATION (réponse chiffrée, le plus proche gagne).
- QCM, MAJORITE, MINORITE, SONDAGE : une réponse par ligne commençant par "-" (2 à 6 réponses). Pour un QCM, la ou les bonnes réponses commencent par "*" au lieu de "-".
- VF : une ligne "= Vrai" ou "= Faux".
- ESTIMATION : une ligne "= nombre", avec l'unité après si utile (ex : "= 330 m").
- LIBRE (réponse écrite) : une ligne "= bonne réponse". Variantes acceptées séparées par " / " (ex : "= Ded Moroz / Dedushka Moroz").
- Options facultatives en fin de ligne de question : [20s] pour le temps de réponse, [lecture 5s] pour le temps de lecture avant les réponses, [1000pts] pour les points, [sans vitesse] pour désactiver le bonus vitesse, [sans classement] pour ne pas afficher le classement après.
- PANNEAU : un écran de message entre deux questions. Ligne "PANNEAU: Titre", puis le message sur les lignes suivantes. Ajoute [classement] pour afficher le classement, [10s] pour passer automatiquement.
- Une ligne vide entre chaque question.
- Si je ne précise pas le type, choisis le plus adapté. Si je ne donne pas les mauvaises réponses d'un QCM, invente des propositions crédibles.

Exemple :
${IMPORT_FORMAT}

Mes questions :
`;

const TYPE_ALIASES = {q:'qcm', qcm:'qcm', question:'qcm', vf:'vf', 'vrai/faux':'vf', 'vrai faux':'vf', 'vrai-faux':'vf',
  libre:'libre', texte:'libre', ecrit:'libre', écrit:'libre', 'reponse ecrite':'libre', 'réponse écrite':'libre', panneau:'panneau', message:'panneau', pause:'panneau', majorite:'majorite', majorité:'majorite', minorite:'minorite', minorité:'minorite', sondage:'sondage', estimation:'estimation', nombre:'estimation'};

function parseQuestionsText(raw){
  const txt = raw.trim();
  if(!txt) return {questions:[], errors:[]};
  if(txt[0] === '{' || txt[0] === '['){
    try{ const d = JSON.parse(txt); const arr = Array.isArray(d) ? d : d.questions;
      return {questions: arr.map(q => ({...newQuestion(q.type || 'qcm'), ...q, id:uid()})), errors:[]};
    }catch(e){ return {questions:[], errors:['JSON invalide']}; }
  }
  const out = []; let cur = null;
  const headRe = /^(?:\d+\s*[.)-]\s*)?(qcm|q|question|vf|vrai\s*[\/-]?\s*faux|majorit[ée]|minorit[ée]|sondage|estimation|nombre|panneau|message|pause|libre|texte|[ée]crit|r[ée]ponse\s+[ée]crite)\s*[:.)-]\s*(.+)$/i;
  for(let line of txt.split(/\r?\n/)){
    line = line.trim();
    if(!line) continue;
    const h = line.match(headRe);
    if(h){
      const type = TYPE_ALIASES[h[1].toLowerCase().replace(/\s+/g,' ')] || 'qcm';
      let text = h[2];
      cur = newQuestion(type); cur.choices = []; if(type === 'qcm') cur.correct = []; if(type === 'vf') cur.correct = [];
      const t = text.match(/\[\s*(\d+)\s*s(?:ec)?\s*\]/i); if(t) cur.time = Math.min(120, Math.max(5, +t[1]));
      const pt = text.match(/\[\s*(\d+)\s*pts?\s*\]/i); if(pt) cur.points = +pt[1];
      if(type === 'panneau'){ if(t) cur.time = +t[1]; if(/\[\s*classement\s*\]/i.test(text)) cur.showBoard = true; }
      const rd = text.match(/\[\s*lecture\s*(\d+)\s*s?\s*\]/i); if(rd && type !== 'panneau') cur.read = Math.min(30, +rd[1]);
      if(/\[\s*sans\s+classement\s*\]/i.test(text)) cur.board = false;
      if(/\[\s*sans\s+vitesse\s*\]/i.test(text)) cur.speed = false;
      else if(/\[\s*vitesse\s*\]/i.test(text)) cur.speed = true;
      cur.text = text.replace(/\[[^\]]*\]/g, '').trim();
      out.push(cur); continue;
    }
    if(cur && cur.type === 'panneau'){ cur.body = (cur.body ? cur.body + '\n' : '') + line.replace(/^[-*•]\s*/, ''); continue; }
    if(!cur){ cur = newQuestion('qcm'); cur.choices = []; cur.correct = []; cur.text = line; out.push(cur); continue; }
    const ans = line.match(/^=\s*(.+)$/);
    if(ans){
      const v = ans[1].trim();
      if(cur.type === 'vf'){ cur.correct = [/^f/i.test(v) ? 1 : 0]; }
      else if(cur.type === 'libre'){ cur.accepted = (cur.accepted || []).filter(x => x.trim()).concat(v.split(/\s+\/\s+|\s*\|\s*/).map(x => x.trim()).filter(Boolean)); }
      else { const m = v.replace(/\s/g,'').match(/^-?[\d.,]+/);
        if(cur.type !== 'estimation'){ cur.type = 'estimation'; cur.choices = []; cur.correct = []; cur.speed = false; }
        cur.answer = m ? +m[0].replace(',', '.') : ''; cur.unit = v.replace(/^[\s\d.,-]+/, '').trim(); }
      continue;
    }
    const c = line.match(/^([-*•✓✅+]|\d+[.)])\s*(.+)$/);
    if(c && cur.type !== 'vf' && cur.type !== 'estimation'){
      let label = c[2].trim(), good = /^[*✓✅+]$/.test(c[1]);
      if(/\s*\((bonne|vrai|correct)\)\s*$/i.test(label)){ good = true; label = label.replace(/\s*\((bonne|vrai|correct)\)\s*$/i, ''); }
      if(cur.choices.length < 6){ cur.choices.push(label); if(good && cur.type === 'qcm') cur.correct.push(cur.choices.length - 1); }
      continue;
    }
    cur.text += ' ' + line; // suite du texte de la question
  }
  const errors = [];
  out.forEach((q, i) => {
    const n = `Q${i+1}`;
    if(!q.text) errors.push(`${n} : texte vide`);
    if(q.type === 'panneau') return;
    if(q.type === 'vf' && !q.correct.length) errors.push(`${n} : ajoute "= Vrai" ou "= Faux"`);
    if(q.type === 'estimation' && (q.answer === '' || isNaN(q.answer))) errors.push(`${n} : ajoute "= nombre"`);
    if(q.type === 'libre' && !(q.accepted || []).some(a => a.trim())) errors.push(`${n} : ajoute "= bonne réponse"`);
    if(['qcm','majorite','minorite','sondage'].includes(q.type) && q.choices.length < 2) errors.push(`${n} : il faut au moins 2 réponses`);
    if(q.type === 'qcm' && q.choices.length >= 2 && !q.correct.length) errors.push(`${n} : marque la bonne réponse avec *`);
  });
  return {questions: out, errors};
}

/* ---------- Traduction FR <-> EN (service gratuit MyMemory, sans compte) ---------- */
const trCache = store.get('quiz-tr-cache', {}) || {};
function saveTrCache(){ const k = Object.keys(trCache); if(k.length > 4000) k.slice(0, 2000).forEach(x => delete trCache[x]); store.set('quiz-tr-cache', trCache); }
function decodeEntities(t){ const ta = document.createElement('textarea'); ta.innerHTML = t; return ta.value; }
async function translateText(text, from, to){
  if(!text || !String(text).trim() || /^[\d\s.,:%€$+-]+$/.test(text) || text.length > 480) return text; // > 480 car. : limite du service, on garde l'original
  const key = from + to + text; if(trCache[key]) return trCache[key];
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
  const d = await r.json();
  const out = d && d.responseData && d.responseData.translatedText;
  if(!out || d.responseStatus == 429 || /MYMEMORY WARNING|QUOTA/i.test(out)) throw new Error('quota');
  if(+d.responseStatus !== 200) throw new Error('service');
  return trCache[key] = decodeEntities(out);
}
// Traduit un quiz complet (contenu uniquement) et renvoie une copie
async function translateQuiz(src, from, to, onProgress){
  const copy = JSON.parse(JSON.stringify(src));
  const jobs = [];
  const add = (obj, k) => { if(obj && typeof obj[k] === 'string' && obj[k].trim()) jobs.push({obj, k}); };
  add(copy, 'title');
  copy.questions.forEach(q => {
    add(q, 'text'); add(q, 'body'); add(q, 'unit');
    if(q.type !== 'vf') (q.choices || []).forEach((c, i) => jobs.push({obj: q.choices, k: i}));
    (q.accepted || []).forEach((c, i) => jobs.push({obj: q.accepted, k: i}));
  });
  (copy.messages || []).forEach(m => { add(m, 'title'); add(m, 'body'); });
  (copy.teams && copy.teams.list || []).forEach(t => add(t, 'name'));
  let done = 0, failed = null;
  const worker = async () => {
    while(jobs.length && !failed){
      const j = jobs.shift();
      try{ const v = j.obj[j.k]; if(typeof v === 'string' && v.trim()) j.obj[j.k] = await translateText(v, from, to); }
      catch(err){ failed = err.message || 'service'; }
      done++; onProgress && onProgress(done);
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  saveTrCache();
  if(failed) throw new Error(failed);
  copy.questions.forEach((q, qi) => {
    if(q.type === 'vf') q.choices = to === 'en' ? ['True','False'] : ['Vrai','Faux'];
    if(q.type === 'libre'){ const orig = src.questions[qi].accepted || []; q.accepted = [...new Set([...q.accepted, ...orig].filter(x => x && x.trim()))]; }
  });
  copy.lang = to;
  return copy;
}

function validateQuiz(){
  const errs = [];
  if(!QUIZ.questions.length) errs.push('Ajoute au moins une question');
  if(QUIZ.questions.length && QUIZ.questions.every(isPanel)) errs.push('Ajoute au moins une vraie question');
  QUIZ.questions.forEach((q, i) => {
    const n = i + 1;
    if(isPanel(q)){ if(!q.text.trim()) errs.push(`Élément ${n} : titre du panneau vide`); return; }
    if(!q.text.trim()) errs.push(`Q${n} : texte vide`);
    if(q.type === 'estimation'){ if(q.answer === '' || isNaN(+q.answer)) errs.push(`Q${n} : bonne réponse chiffrée manquante`); return; }
    if(q.type === 'libre'){ if(!(q.accepted || []).some(a => a.trim())) errs.push(`Q${n} : indique la bonne réponse`); return; }
    if(q.type !== 'vf' && choicesOf(q).filter(c => c.trim()).length < 2) errs.push(`Q${n} : il faut au moins 2 réponses`);
    if(q.type !== 'vf' && choicesOf(q).some(c => !c.trim())) errs.push(`Q${n} : une réponse est vide`);
    if(q.type === 'qcm' && !q.correct.length) errs.push(`Q${n} : coche au moins une bonne réponse`);
  });
  return errs;
}

function hostOnMsg(m){

function addPlayer({id, name, emoji, team}){

/* ---------- Déroulé ---------- */
function startGame(){
  Object.values(G.players).forEach(p => Object.assign(p, {score:0, streak:0, lastGain:0, lastOk:null, prevRank:null}));
  G.qi = -1; nextQuestion();
}
function nextQuestion(){
  G.qi++; G.answers = {}; G.reveal = null;
  if(G.qi >= G.quiz.questions.length){ G.phase = 'podium'; changed(); setTimeout(() => { fanfare(); confetti(260); }, 900); return; }
  const q = curQ();
  if(isPanel(q)){ G.phase = 'panel'; G.panelEnd = q.time ? Date.now() + q.time * 1000 : 0; changed(); return; }
  const read = q.read ?? 3;
  if(!read){ openQuestion(); return; }
  G.phase = 'ready'; G.readyEnd = Date.now() + read * 1000 + 400; changed();
}
function openQuestion(){
  const q = curQ();
  G.phase = 'question'; G.qStart = Date.now(); G.deadline = G.qStart + q.time * 1000;
  changed(); scheduleBots(q);
}
function scheduleBots(q){
  botTimers.forEach(clearTimeout); botTimers = [];
  Object.values(G.players).filter(p => p.bot).forEach(p => {
    const delay = 1000 + Math.random() * q.time * 800;
    botTimers.push(setTimeout(() => {
      let v;
      const n = choicesOf(q).length;
      if(q.type === 'libre'){ const acc = q.accepted.filter(Boolean); v = Math.random() < .55 ? acc[0] : ['Je sais pas','Paris','Zut','Bonne question'][Math.floor(Math.random()*4)]; }
      else if(q.type === 'estimation'){ const a = +q.answer; v = Math.round(a + (Math.random() - .5) * Math.max(10, Math.abs(a) * .3)); }
      else if((q.type === 'qcm' || q.type === 'vf') && Math.random() < .6) v = q.correct[0];
      else v = Math.floor(Math.random() * n);
      handleAnswer(p.id, G.qi, v);
    }, delay));
  });
}
function handleAnswer(pid, qi, value){
  if(!G || G.phase !== 'question' || qi !== G.qi || !G.players[pid] || G.answers[pid]) return;
  const q = curQ();
  if(q.type === 'estimation'){ value = +value; if(!isFinite(value)) return; }
  else if(q.type === 'libre'){ value = String(value ?? '').trim().slice(0, 60); if(!value) return; }
  else { value = +value; if(!(value >= 0 && value < choicesOf(q).length)) return; }
  G.answers[pid] = {value, ms: Date.now() - G.qStart};
  beep(520 + Object.keys(G.answers).length * 30, .05, 'square', .03);
  const total = Object.keys(G.players).length;
  changed(false);
  if(Object.keys(G.answers).length >= total) setTimeout(() => G.phase === 'question' && doReveal(), 700);
}

function computeReveal(q, answers){
  const n = choicesOf(q).length, P = q.points;
  const speedPts = ms => { if(!q.speed) return P; const r = Math.min(1, Math.max(0, ms / (q.time * 1000))); return Math.round(P * (1 - r / 2)); };
  const gains = {};
  if(q.type === 'estimation'){
    const target = +q.answer, range = Math.max(1, Math.abs(target));
    const list = Object.entries(answers).map(([pid,a]) => ({pid, v:+a.value, d:Math.abs(+a.value - target)})).sort((a,b) => a.d - b.d);
    const best = list.length ? list[0].d : 0;
    list.forEach(x => { const ok = x.d === best; gains[x.pid] = {pts: ok ? P : Math.round(P * .7 * Math.max(0, 1 - x.d / range)), ok, value:x.v, diff:x.d}; });
    return {type:q.type, counts:[], winners:[], gains, target, unit:q.unit || '', closest: list.slice(0,5).map(x => ({pid:x.pid, v:x.v, d:x.d}))};
  }
  if(q.type === 'libre'){
    const acc = (q.accepted || []).filter(a => a.trim()), groups = {};
    Object.entries(answers).forEach(([pid,a]) => {
      const ok = textMatches(a.value, acc, q.fuzzy !== false);
      gains[pid] = {pts: ok ? speedPts(a.ms) : 0, ok, value:a.value, ms:a.ms};
      const k = normTxt(a.value) || a.value; (groups[k] = groups[k] || {text:a.value, n:0, ok}).n++;
    });
    return {type:q.type, counts:[], winners:[], gains, accepted:acc, given: Object.values(groups).sort((a,b) => b.n - a.n).slice(0, 8)};
  }
  const counts = Array(n).fill(0);
  Object.values(answers).forEach(a => counts[a.value]++);
  let winners = [];
  if(q.type === 'qcm' || q.type === 'vf') winners = q.correct.slice();
  if(q.type === 'majorite'){ const m = Math.max(0, ...counts); if(m > 0) winners = counts.flatMap((c,i) => c === m ? [i] : []); }
  if(q.type === 'minorite'){ const used = counts.filter(c => c > 0); if(used.length >= 2){ const m = Math.min(...used); winners = counts.flatMap((c,i) => c === m ? [i] : []); } }
  Object.entries(answers).forEach(([pid,a]) => {
    if(q.type === 'sondage'){ gains[pid] = {pts:0, ok:null, value:a.value}; return; }
    const ok = winners.includes(a.value);
    gains[pid] = {pts: ok ? speedPts(a.ms) : 0, ok, value:a.value, ms:a.ms};
  });
  return {type:q.type, counts, winners, gains};
}

function doReveal(){
  if(G.phase !== 'question') return;
  botTimers.forEach(clearTimeout);
  const q = curQ();
  const before = ranked(); before.forEach(p => G.players[p.id].prevRank = p.rank);
  G.reveal = computeReveal(q, G.answers);
  Object.values(G.players).forEach(p => {
    const g = G.reveal.gains[p.id];
    let gain = 0;
    if(q.type === 'sondage'){ p.lastOk = null; }
    else if(g && g.ok){ p.streak++; gain = g.pts + (P_streakBonus(p.streak, q)); p.lastOk = true; }
    else { p.streak = 0; gain = g ? g.pts : 0; p.lastOk = g ? false : 'none'; }
    p.lastGain = gain; p.score += gain;
  });
  G.phase = 'reveal'; changed();
  beep(392,.2,'triangle'); setTimeout(() => beep(523,.3,'triangle'), 180);
}
function P_streakBonus(streak, q){ return (q.points > 0 && streak >= 2) ? Math.min(500, (streak - 1) * 100) : 0; }

function hostTick(){
  if(!G) return;
  if(G.phase === 'ready' && Date.now() >= G.readyEnd) openQuestion();
  if(G.phase === 'panel' && G.panelEnd && Date.now() >= G.panelEnd){ G.panelEnd = 0; nextQuestion(); return; }
  if(G.phase === 'question'){
    const left = Math.ceil((G.deadline - Date.now()) / 1000);
    if(left !== hostTick.last && left <= 5 && left > 0) beep(left <= 2 ? 880 : 660, .08);
    hostTick.last = left;
    if(Date.now() >= G.deadline) doReveal();
  }
  if(G.phase === 'ready'){ const n = Math.ceil((G.readyEnd - Date.now()) / 1000); const el = $('.ready-num'); if(el && el.textContent != n) el.textContent = Math.max(1, n); }
}

}

// mode de langue de la partie : 'fr', 'en' (tout traduit) ou 'both' (chaque joueur choisit sur son téléphone)
async function setGameLang(mode){
  if(!G || G.translating) return;
  const cur = G.mode || G.lang || 'fr'; if(mode === cur) return;
  const src = G.quizSrc || G.quiz, srcLang = src.lang || 'fr', other = srcLang === 'fr' ? 'en' : 'fr';
  if(mode === srcLang){ G.quiz = src; delete G.quizSrc; G.alt = null; G.lang = srcLang; G.mode = mode; changed(); return; }
  const game = G;
  G.translating = true; changed();
  try{
    const tq = await translateQuiz(src, srcLang, other, n => { const el = $('#langProg'); if(el) el.textContent = `Traduction du quiz... ${n}`; });
    if(G !== game) return;                               // partie quittée pendant la traduction
    tq.theme = src.theme;
    if(mode === 'both'){
      // le quiz de référence garde sa langue ; les réponses écrites acceptent les deux langues
      const merged = JSON.parse(JSON.stringify(src));
      merged.questions.forEach((q, i) => { if(q.type === 'libre') q.accepted = [...new Set([...(q.accepted || []), ...(tq.questions[i].accepted || [])].filter(x => x && x.trim()))]; });
      G.quizSrc = src; G.quiz = merged; G.alt = tq; G.altLang = other; G.lang = srcLang;
      toast('Mode bilingue prêt ✅ chaque joueur choisit sa langue');
    } else {
      G.quizSrc = src; G.quiz = tq; G.alt = null; G.lang = other;
      toast(other === 'en' ? 'Quiz traduit en anglais ✅' : 'Quiz traduit en français ✅');
    }
    G.mode = mode;
  }catch(err){
    if(G !== game) return;
    toast(err.message === 'quota' ? '⚠️ Limite gratuite de traduction atteinte aujourd\'hui' : '⚠️ Traduction impossible, vérifie la connexion');
  }
  G.translating = false; changed();
}

function tilesHTML(q, reveal){

      ${reveal ? `<div class="bar" data-w="${(reveal.counts[i] / total * 100).toFixed(1)}"></div>` : ''}
      <span class="shape">${SHAPES[i]}</span><span class="lab">${esc(c)}${altTxt(c, ac[i]) ? `<small class="t-alt">${esc(ac[i])}</small>` : ''}</span>

  if(q.type === 'sondage') msg = L('📊 Résultats du sondage', '📊 Poll results');

/* ---------- Minuteur commun (host et joueur) ---------- */
let clockOffset = 0; // côté joueur : hostNow - Date.now()
function updateTimers(){
  const isHost = location.hash.startsWith('#host');
  const st = isHost ? G : S;
  if(st && st.phase === 'panel' && st.panelEnd){
    const q = isHost ? curQ() : st.q, now = Date.now() + (isHost ? 0 : clockOffset);
    const el = document.getElementById('panelBar'); if(el && q && q.time) el.style.width = Math.max(0, (st.panelEnd - now) / (q.time * 1000) * 100) + '%';
  }
  if(!st || st.phase !== 'question') return;
  const now = Date.now() + (isHost ? 0 : clockOffset);
  const total = (isHost ? curQ().time : S.q.time) * 1000;
  const left = Math.max(0, st.deadline - now);
  document.querySelectorAll('[data-timer]').forEach(el => el.textContent = Math.ceil(left / 1000));
  document.querySelectorAll('[data-ring]').forEach(c => { const len = +c.getAttribute('stroke-dasharray'); c.setAttribute('stroke-dashoffset', len * (1 - left / total)); c.setAttribute('stroke', left < 5000 ? '#EF4444' : '#E48548'); });
  document.querySelectorAll('.mini-timer div').forEach(d => d.style.width = (left / total * 100) + '%');
}
