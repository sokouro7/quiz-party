let S = null;            // dernier état reçu
let lastStateAt = 0;
document.addEventListener('visibilitychange', () => {
  if(document.hidden || !location.hash.startsWith('#join=') || !transport) return;
  transport.send({kind:'hello'});                      // retour de veille : on redemande l'état tout de suite
  setTimeout(() => { if(Date.now() - lastStateAt > 4000){ transport.kick(); transport.send({kind:'hello'}); } }, 2500);
});
let ME = null;           // {id,name,emoji,team}
let myAnswer = null;     // {qi, value, at}
let playerKey = '';

function startPlayer(code){
  LANG = (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr';
  ME = sess.get('quiz-me-' + code, null) || {id: uid(), name: sess.get('quiz-lastname', ''), emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)], team: null, joined:false};
  ME.lang = ME.lang || ((navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr');
  myAnswer = sess.get('quiz-ans-' + code, null);
  S = null; playerKey = '';
  if(transport) transport.close();
  transport = createTransport(code, 'player');
  transport.on(m => {
    if(m && m.from === '_net'){ transport.send({kind:'hello'}); if(ME.joined) transport.send({kind:'join', ...ME}); return; }
    if(!m || m.from !== 'host' || m.kind !== 'state' || m.room !== code) return;
    if(m.v && m.v > APP_VERSION && sess.get('quiz-reloaded', '') !== m.v){ // version du téléphone en cache plus ancienne que celle de l'animateur
      sess.set('quiz-reloaded', m.v); location.replace(location.pathname + '?v=' + encodeURIComponent(m.v) + location.hash); return; }
    lastStateAt = Date.now();
    clockOffset = m.hostNow - Date.now();
    const prevPhase = S && S.phase + S.qi;
    S = m; LANG = playerLang(); renderOverlay();
    if(playerKey && !playerKey.startsWith('join')) playerFx();   // ré-applique l'ambiance de l'animateur à chaque mise à jour
    if(ME.joined && !S.players.find(p => p.id === ME.id) && S.phase === 'lobby' && Date.now() - (ME.joinedAt || 0) > 2500){ ME.joined = false; saveMe(); } // retiré par l'animateur
    if((S.phase === 'lobby' || S.phase === 'ready') && myAnswer && myAnswer.qi >= S.qi){ myAnswer = null; sess.set('quiz-ans-' + code, null); }
    if(prevPhase !== S.phase + S.qi && S.phase === 'reveal'){ const me = S.players.find(p => p.id === ME.id); if(me && me.lastOk === true && navigator.vibrate) navigator.vibrate([60,40,60]); }
    renderPlayer();
  });
  fx({theme:'noel', snow:.5});
  app.innerHTML = `<div class="center"><div class="logo">Quiz <b>Party</b></div><h2>${L('Connexion à', 'Connecting to')} ${esc(code)}...</h2><p class="mute" id="wait">${L('Recherche de la partie', 'Looking for the game')}</p></div>`;
  transport.send({kind:'hello'});
  if(ME.joined) transport.send({kind:'join', ...ME});
  stopTimers();
  tickers.push(setInterval(updateTimers, 100));
  lastStateAt = Date.now();
  tickers.push(setInterval(() => {                      // le grand écran envoie un signal toutes les 3 s
    if(Date.now() - lastStateAt > 9000){ setNet('connecting'); transport.kick(); transport.send({kind:'hello'}); lastStateAt = Date.now(); }
  }, 3000));
  tickers.push(setTimeout(() => { if(!S){ const w = $('#wait'); if(w) w.innerHTML = L('Aucune partie trouvée avec ce code.<br>Vérifie le code ou que l\'animateur est bien sur la page.<br><br><a href="#join" style="color:#fff">Changer de code</a>', 'No game found with this code.<br>Check the code, or that the host is on the game page.<br><br><a href="#join" style="color:#fff">Change code</a>'); } }, 8000));
}
// contenu affiché au joueur : version traduite si la partie est bilingue et qu'il a choisi l'autre langue
function useAlt(){ return S && S.mode === 'both' && S.alt && ME && ME.lang === S.alt.lang; }
function QQ(){ return useAlt() && S.alt.q ? {...S.q, ...S.alt.q} : S.q; }
function playerLang(){ return S && S.mode === 'both' ? (ME.lang || S.lang || 'fr') : ((S && S.lang) || 'fr'); }
function playerFx(){ const P = S.phase; fx({theme: S.theme, snow: {lobby:.8, podium:1, ready:.4, panel:.7}[P] ?? .25, sleigh: P === 'lobby' || P === 'podium', hills: P === 'lobby' || P === 'podium'}); }
const saveMe = () => { sess.set('quiz-me-' + S.room, ME); sess.set('quiz-lastname', ME.name); };

function renderPlayer(){
  const meP = S.players.find(p => p.id === ME.id);
  const inGame = ME.joined && meP;
  const answeredNow = S.answered.includes(ME.id) || (myAnswer && myAnswer.qi === S.qi);
  const key = !inGame ? 'join' + JSON.stringify(S.teams) + S.lang + S.mode + ME.lang + S.theme : [S.phase, S.qi, answeredNow, S.lang, S.mode, ME.lang, S.theme, S.phase === 'lobby' ? S.players.length + (meP.team || '') : ''].join('|');
  if(key === playerKey) return;
  const typing = document.activeElement && ['nm','est','txt'].includes(document.activeElement.id);
  if(typing && key.startsWith('join') && playerKey.startsWith('join')) return;
  playerKey = key;
  if(!inGame) return playerJoin();
  const head = `<div class="p-head"><span class="pill">${meP.emoji} ${esc(meP.name)}</span>${S.mode === 'both' ? `<button class="pill" id="langSw" title="Langue / Language">${ME.lang === 'en' ? '🇬🇧 EN' : '🇫🇷 FR'}</button>` : `<span class="pill net" id="net"></span>`}<span class="pill">${fmt(meP.score)} pts</span></div>`;
  let body = '';
  const P = S.phase;
  if(P === 'lobby'){
    const team = S.teams && S.teams.find(t => t.id === meP.team);
    body = `<div class="p-feedback" style="background:rgba(255,255,255,.05)"><div class="p-avatar" id="pAv">${meP.emoji}</div><div class="big">${L('Tu es dans la partie !', "You're in!")}</div>
      ${team ? `<div class="pill" style="border-color:${team.color};color:${team.color};font-size:16px">${esc(team.name)}</div>` : ''}
      <p class="mute">${L(`${S.players.length} joueur${S.players.length > 1 ? 's' : ''} connecté${S.players.length > 1 ? 's' : ''}. Regarde le grand écran, ça va commencer.`, `${S.players.length} player${S.players.length > 1 ? 's' : ''} connected. Watch the big screen, it's about to start.`)}</p>
      ${reactBlock()}</div>`;
  }
  if(P === 'ready') body = `<div class="p-feedback" style="background:rgba(255,255,255,.05)"><p class="mute">Question ${S.qnum} / ${S.qtotal}</p><div class="pill">${TYPES[S.q.type].icon} ${tl(TYPES[S.q.type])}</div><div class="emo" style="animation:pulse 1s infinite">⏳</div><div class="p-q" style="font-size:22px">${esc(QQ().text)}</div><p class="mute">${L('Prépare-toi...', 'Get ready...')}</p></div>`;
  if(P === 'question'){
    if(answeredNow){
      const t = myAnswer && myAnswer.qi === S.qi ? myAnswer.ms : null;
      body = `<div class="mini-timer"><div></div></div><div class="p-feedback" style="background:rgba(99,102,241,.2)"><div class="emo">🚀</div><div class="big">${L('Réponse envoyée', 'Answer sent')}</div>
        ${t != null ? `<p class="mute">⚡ ${L('en', 'in')} ${L((t/1000).toFixed(1).replace('.',','), (t/1000).toFixed(1))} s</p>` : ''}<p class="mute">${L('On attend les autres...', 'Waiting for the others...')}</p></div>`;
    } else if(S.q.type === 'libre'){
      body = `<div class="mini-timer"><div></div></div><p style="font-weight:700;font-size:20px;text-align:center">${esc(QQ().text)}</p>
        <form class="p-feedback" id="txtForm" style="background:rgba(255,255,255,.05);flex:0;padding:20px"><input id="txt" type="text" maxlength="60" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" placeholder="${L('Ta réponse', 'Your answer')}" style="font-size:26px;text-align:center;font-weight:700">
        <button type="submit" class="btn big warm" style="width:100%">${L('Valider', 'Submit')}</button></form>`;
    } else if(S.q.type === 'estimation'){
      body = `<div class="mini-timer"><div></div></div><p style="font-weight:700;font-size:20px;text-align:center">${esc(QQ().text)}</p>
        <div class="p-feedback" style="background:rgba(255,255,255,.05);flex:0;padding:20px"><input id="est" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="${L('Ton estimation', 'Your estimate')}" style="font-size:32px;text-align:center;font-weight:700">
        ${QQ().unit ? `<p class="mute">${L('en', 'in')} ${esc(QQ().unit)}</p>` : ''}<button class="btn big warm" id="estGo" style="width:100%">${L('Valider', 'Submit')}</button></div>`;
    } else {
      body = `<div class="mini-timer"><div></div></div><p style="font-weight:700;font-size:18px;text-align:center">${esc(QQ().text)}</p>
        <div class="p-tiles">${QQ().choices.map((c,i) => `<button class="p-tile" data-v="${i}" style="background:${COLORS[i]};animation-delay:${i*50}ms"><span class="shape">${SHAPES[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>`;
    }
  }
  if(P === 'reveal') body = playerReveal(meP) + reactFab(meP);
  if(P === 'panel') body = `<div class="p-feedback" style="background:linear-gradient(160deg,rgba(228,133,72,.35),rgba(79,70,229,.3));flex:0">
      <div class="big" style="font-size:34px">${esc(QQ().text)}</div>${QQ().body ? `<p style="font-size:18px">${nl2br(QQ().body)}</p>` : ''}
      ${S.panelEnd ? `<div class="mini-timer" style="width:100%"><div id="panelBar"></div></div>` : ''}</div>
    ${S.q.showBoard ? playerBoard(meP, false) : ''}${reactFab(meP)}`;
  if(P === 'leaderboard') body = playerBoard(meP, false) + reactFab(meP);
  if(P === 'podium'){
    const top = meP.rank <= 3;
    body = `<div class="p-feedback" style="background:${top ? 'linear-gradient(160deg,#F5C451,#D08A1E)' : 'rgba(255,255,255,.06)'}">
      <div class="emo">${['🥇','🥈','🥉'][meP.rank-1] || '🎈'}</div><div class="big">${ord(meP.rank)} ${L('sur', 'of')} ${S.players.length}</div><div class="pts">${fmt(meP.score)} pts</div>
      ${S.teamScores ? `<p>${L('Équipe gagnante', 'Winning team')} : <b>${esc(S.teamScores[0].name)}</b></p>` : ''}<p style="opacity:.8">${L("Merci d'avoir joué !", 'Thanks for playing!')}</p>${reactBlock()}</div>`;
    if(top) setTimeout(() => confetti(140), 300);
  }
  app.innerHTML = `<div class="p-wrap">${head}${body}</div>`;
  playerFx();
  playerCelebrate(P, meP);
  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll('.p-res .bar').forEach(b => b.style.width = b.dataset.w + '%'), 80));
  app.onclick = e => {
    if(e.target.closest('#langSw')){ ME.lang = ME.lang === 'en' ? 'fr' : 'en'; sess.set('quiz-me-' + S.room, ME); LANG = playerLang(); ovlShownId = null; playerKey = ''; renderPlayer(); renderOverlay(); return; }
    const rb = e.target.closest('#reactBtn, .react-trigger'); if(rb) return sendReact(rb);
    const av = e.target.closest('#pAv'); if(av){ const r = av.getBoundingClientRect(); emojiBurst(r.left + r.width / 2, r.top + r.height / 2, 8);
      av.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-40px) scale(1.2) rotate(15deg)'},{transform:'translateY(0) scale(1)'}], {duration:500, easing:'cubic-bezier(.3,1.6,.5,1)'}); navigator.vibrate && navigator.vibrate(10); return; }
    const b = e.target.closest('.p-tile'); if(b) sendAnswer(+b.dataset.v);
    if(e.target.id === 'estGo') sendEst();
  };
  setNet(NET);
  const tf = $('#txtForm'); if(tf) tf.onsubmit = e => { e.preventDefault(); const v = $('#txt').value.trim(); if(!v) return toast(L('Écris une réponse', 'Type an answer')); $('#txt').blur(); sendAnswer(v); };
  const est = $('#est'); if(est) est.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); sendEst(); } });
  updateTimers();
}
function sendEst(){ const v = $('#est').value.replace(',', '.').replace(/\s/g, ''); if(v === '' || !isFinite(+v)) return toast(L('Entre un nombre', 'Enter a number')); sendAnswer(+v); }
function sendAnswer(v){
  if(S.phase !== 'question' || (myAnswer && myAnswer.qi === S.qi)) return;
  const now = Date.now() + clockOffset;
  myAnswer = {qi:S.qi, value:v, ms: now - (S.deadline - S.q.time * 1000)};
  sess.set('quiz-ans-' + S.room, myAnswer);
  transport.send({kind:'answer', id:ME.id, qi:S.qi, value:v});
  navigator.vibrate && navigator.vibrate(30);
  playerKey = ''; renderPlayer();
}

function reactBlock(){
  const th = TH(S.theme);
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px"><button class="react-btn" id="reactBtn" aria-label="Lancer">${th.react}</button>
    <p class="mute" style="font-size:14px;text-align:center">${L(`Touche pour lancer ${th.projName} sur le grand écran`, `Tap to throw ${th.projEn} at the big screen`)}</p></div>`;
}
let lastSent = 0;
let celebrated = '';
function playerCelebrate(P, me){
  const key = S.room + P + S.qi; if(celebrated === key) return; celebrated = key;
  const th = TH(S.theme), cx = innerWidth / 2, cy = innerHeight * .3;
  if(P === 'lobby'){ setTimeout(() => emojiBurst(cx, innerHeight * .35, 16), 250); }
  if(P === 'reveal' && S.reveal){
    const g = S.reveal.gains[ME.id];
    if(g && g.ok === true){ setTimeout(() => { emojiBurst(cx, cy, 22); cheer(L(th.cheer, th.cheerEn)); }, 200); navigator.vibrate && navigator.vibrate([60,40,60]); }
    else if(g && g.ok === false){ setTimeout(() => { const b = document.querySelector('.p-banner'); b && b.classList.add('shake'); }, 80); navigator.vibrate && navigator.vibrate(200); }
  }
  if(P === 'podium' && me.rank <= 3){ setTimeout(() => { emojiBurst(cx, cy, 30); cheer(['🥇','🥈','🥉'][me.rank - 1] + ' ' + L(th.cheer, th.cheerEn)); }, 400); }
}
function sendReact(btn){
  const now = Date.now(); if(now - lastSent < 300) return; lastSent = now;
  { const r = btn.getBoundingClientRect(); emojiBurst(r.left + r.width / 2, r.top + r.height / 2, 3, [TH(S.theme).react]); }
  transport.send({kind:'react', id:ME.id});
  navigator.vibrate && navigator.vibrate(15);
  btn.animate([{transform:'scale(1)'},{transform:'scale(.82) rotate(-12deg)'},{transform:'scale(1.08)'},{transform:'scale(1)'}], {duration:320});
}

function revealVerdict(me){
  const R = S.reveal, t = R && R.type, g = R && R.gains[ME.id];
  let bg = 'rgba(255,255,255,.08)', emo = '⏰', title = L('Trop tard !', 'Too late!');
  if(g){
    if(t === 'sondage'){ bg = 'linear-gradient(135deg,#6366F1,#4338CA)'; emo = '📊'; title = L('Vote enregistré', 'Vote counted'); }
    else if(g.ok){ bg = 'linear-gradient(135deg,#22C55E,#15803D)';
      [emo, title] = {libre:['✍️',L('Bonne réponse !','Correct!')], qcm:['🎉',L('Bonne réponse !','Correct!')], vf:['🎉',L('Bien vu !','Spot on!')], majorite:['🐑',L('Tu as suivi la foule !','You followed the crowd!')], minorite:['🦄',L('Esprit rebelle !','Rebel spirit!')], estimation:['🎯',L('Le plus proche !','Closest!')]}[t]; }
    else { bg = 'linear-gradient(135deg,#EF4444,#991B1B)';
      [emo, title] = {libre:['😬',L('Raté...','Wrong...')], qcm:['😬',L('Raté...','Wrong...')], vf:['😬',L('Raté...','Wrong...')], majorite:['🙃',L('À contre-courant','Against the tide')], minorite:['🐑',L('Trop mainstream','Too mainstream')], estimation:['📏',L('Pas loin...','Not far...')]}[t];
      if(t === 'estimation' && g.pts > 0) bg = 'linear-gradient(135deg,#F5A524,#B45309)'; }
  }
  return {bg, emo, title, g, R, t};
}

function playerReveal(me){
  const {bg, emo, title, g, R, t} = revealVerdict(me);
  const pts = t === 'sondage' ? '' : `<div class="pts">+${fmt(me.lastGain || 0)}</div>`;
  const banner = `<div class="p-banner" style="background:${bg}"><span class="emo">${emo}</span>
    <div><div class="t">${title}</div><div style="opacity:.9;font-size:14px">${ord(me.rank)} ${L('sur', 'of')} ${S.players.length}${me.streak >= 2 ? ` · 🔥 ${L('série de', 'streak of')} ${me.streak}` : ''}</div></div>${pts}</div>`;
  let detail = '';
  if(t === 'libre'){
    detail = `<div class="card" style="text-align:center;padding:16px"><div class="mute">${L('Bonne réponse', 'Right answer')}</div>
        <div style="font-size:34px;font-weight:700;line-height:1.15">${esc((useAlt() && QQ().acc0) || R.accepted[0] || '')}</div>
        ${(() => { const main = (useAlt() && QQ().acc0) || R.accepted[0]; const others = R.accepted.filter(x => x !== main); return others.length ? `<div class="mute" style="font-size:13px">${L('Aussi accepté', 'Also accepted')} : ${others.map(esc).join(', ')}</div>` : ''; })()}
        ${g ? `<div style="margin-top:8px">${L('Ta réponse', 'Your answer')} : <b style="color:${g.ok ? '#86EFAC' : '#FCA5A5'}">${esc(g.value)}</b></div>` : ''}</div>`;
  } else if(t === 'estimation'){
    const nameOf = id => { const p = S.players.find(x => x.id === id); return p ? `${p.emoji} ${esc(p.name)}` : '?'; };
    detail = `<div class="card" style="text-align:center;padding:16px"><div class="mute">${L('Bonne réponse', 'Right answer')}</div>
        <div style="font-size:44px;font-weight:700;line-height:1.1">${fmt(R.target)} ${esc(useAlt() ? QQ().unit : R.unit)}</div>
        ${g ? `<div class="mute" style="margin-top:6px">${L('Ta réponse', 'Your answer')} : <b style="color:#fff">${fmt(g.value)}</b> · ${L('écart', 'off by')} ${fmt(g.diff)}</div>` : ''}</div>
      <div class="mini-lb">${R.closest.slice(0,3).map((c,i) => `<div class="r ${c.pid === ME.id ? 'me' : ''}"><span>${['🥇','🥈','🥉'][i]}</span><span style="flex:1">${nameOf(c.pid)}</span><span>${fmt(c.v)}</span></div>`).join('')}</div>`;
  } else {
    const tot = Math.max(1, R.counts.reduce((a,b) => a + b, 0));
    const note = {majorite:L('La réponse la plus votée gagne', 'The most voted answer wins'), minorite: R.winners.length ? L('La réponse la moins votée gagne', 'The least voted answer wins') : L('Pas de minorité cette fois', 'No minority this time'), sondage:L('Résultats du vote', 'Poll results')}[t] || '';
    detail = `<div class="p-res">${QQ().choices.map((c,i) => {
        const win = R.winners.includes(i), dim = t !== 'sondage' && !win, mine = g && g.value === i;
        return `<div class="r ${win ? 'win' : ''} ${dim ? 'dim' : ''}" style="background:${COLORS[i]};animation-delay:${i*60}ms"><div class="bar" data-w="${(R.counts[i] / tot * 100).toFixed(1)}"></div>
          <span>${SHAPES[i]}</span><span style="flex:1">${esc(c)}${mine ? ` <b>👈 ${L('toi', 'you')}</b>` : ''}</span><span>${win && t !== 'sondage' ? '✓ ' : ''}${R.counts[i]}</span></div>`; }).join('')}</div>
      ${note ? `<p class="p-note">${note}</p>` : ''}`;
  }
  return banner + `<div class="p-q">${esc(QQ().text)}</div>` + detail;
}

function playerBoard(me, withReact = true){
  const top = S.players.slice(0, 5), inTop = top.some(p => p.id === ME.id);
  const row = p => `<div class="r ${p.id === ME.id ? 'me' : ''}"><span style="width:28px">${p.rank}</span><span>${p.emoji}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span>${fmt(p.score)}</span></div>`;
  const team = S.teamScores && S.teamScores.map((t,i) => `<div class="r"><span style="width:28px">${i+1}</span><span style="flex:1;color:${t.color}">${esc(t.name)}</span><span>${fmt(t.score)}</span></div>`).join('');
  return `<div class="p-banner" style="background:linear-gradient(135deg,#4F46E5,#312E81)"><span class="emo">🏆</span>
      <div><div class="t">${L('Tu es', "You're")} ${ord(me.rank)}</div><div style="opacity:.9;font-size:14px">${L('sur', 'of')} ${S.players.length} ${L('joueurs', 'players')}</div></div><div class="pts">${fmt(me.score)}</div></div>
    <div class="mini-lb">${top.map(row).join('')}${inTop ? '' : `<div class="p-note">⋯</div>${row(me)}`}</div>
    ${team ? `<p class="lbl" style="margin-top:6px">${L('Équipes', 'Teams')}</p><div class="mini-lb">${team}</div>` : ''}
    ${withReact ? reactBlock() : ''}`;
}
function reactFab(me){ return `<button class="react-fab react-trigger" aria-label="Lancer">${TH(S.theme).react}<span class="me">${me.emoji}</span></button>`; }

function playerJoin(){
  fx({theme: S.theme, snow: .6});
  LANG = playerLang();
  const teams = S.teams;
  if(teams && !teams.some(t => t.id === ME.team)) ME.team = null;
  app.innerHTML = `<div class="center">
    <div class="logo">Quiz <b>Party</b></div><p class="mute">${esc(useAlt() ? S.alt.title : S.title)} · ${esc(S.room)}</p>
    ${S.mode === 'both' ? `<div class="lang-pick"><button type="button" data-lg="fr" class="${ME.lang !== 'en' ? 'sel' : ''}">🇫🇷 Français</button><button type="button" data-lg="en" class="${ME.lang === 'en' ? 'sel' : ''}">🇬🇧 English</button></div>` : ''}
    <span class="emoji-pick" id="emo">${ME.emoji}</span>
    <p class="mute" style="font-size:13px;margin-top:-10px">${L("Touche l'avatar pour en changer", 'Tap the avatar to change it')}</p>
    <form id="joinForm" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:18px"><input id="nm" type="text" maxlength="18" placeholder="${L('Ton pseudo', 'Your nickname')}" value="${esc(ME.name)}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" style="max-width:320px;text-align:center;font-size:22px;font-weight:600">
    ${teams ? `<div class="team-pick" style="max-width:360px">${teams.map(t => `<button type="button" data-t="${t.id}" class="${ME.team === t.id ? 'sel' : ''}" style="border-color:${t.color};${ME.team === t.id ? `background:${t.color}` : `color:${t.color}`}">${esc(t.name)}</button>`).join('')}</div>
      <p class="mute" style="font-size:13px">${L("Sans choix, tu seras placé dans l'équipe la plus petite", "If you don't pick, you'll join the smallest team")}</p>` : ''}
    <button type="submit" class="btn big warm" id="joinGo">${L('Je rejoins', 'Join')} 🚀</button></form>
    ${S.phase !== 'lobby' ? `<p class="mute">${L('La partie a commencé, tu peux quand même rejoindre.', 'The game has started, you can still join.')}</p>` : ''}</div>`;
  $('#emo').onclick = e => { ME.emoji = EMOJIS[(EMOJIS.indexOf(ME.emoji) + 1) % EMOJIS.length]; e.target.textContent = ME.emoji; };
  document.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { ME.lang = b.dataset.lg; ME.name = $('#nm').value; LANG = playerLang(); playerKey = ''; playerJoin(); });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { ME.team = b.dataset.t; ME.name = $('#nm').value; playerKey = ''; playerJoin(); });
  const go = () => { const n = $('#nm').value.trim(); if(!n) return toast(L('Choisis un pseudo', 'Pick a nickname')); ME.name = n; ME.joined = true; ME.joinedAt = Date.now(); saveMe(); transport.send({kind:'join', ...ME}); playerKey = ''; };
  $('#joinForm').onsubmit = e => { e.preventDefault(); $('#nm').blur(); go(); };
  $('#nm').oninput = e => { ME.name = e.target.value; };
  $('#nm').onfocus = () => setTimeout(() => $('#nm') && $('#nm').scrollIntoView({block:'center', behavior:'smooth'}), 300);
}

/* ---------------- Go ---------------- */
route();
</script>
</body>
</html>
